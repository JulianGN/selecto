<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo do iFrame Separado</title>
  <style>
    body {
      background: #1e293b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #a5b4fc;
      font-size: 1.1rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .box {
      background: #334155;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #059669;
    }
    input {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      width: calc(100% - 24px);
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      background: #6366f1;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h3>📄 Documento Carregado via URL (src="test-iframe-content.html")</h3>
  <p>Página de iframe independente para validar seleção e inspeção de seletores.</p>

  <div class="box">
    <button id="iframe-url-btn" class="btn" data-testid="iframe-url-button">Botão no iFrame (URL)</button>
    <br><br>
    <label for="iframe-url-input">Campo de Texto no iFrame:</label>
    <input id="iframe-url-input" type="text" placeholder="Digite algo dentro do iframe..." data-qa="iframe-url-input-field" />
  </div>

  <div class="box" style="display: flex; gap: 8px; align-items: center;">
    <span class="badge" data-testid="status-badge-iframe">Ativo no iFrame</span>
    <span style="font-size: 12px; color: #cbd5e1;">Exemplo de elemento de texto span</span>
  </div>
</body>
</html>
